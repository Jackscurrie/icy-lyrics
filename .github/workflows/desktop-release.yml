name: Publish desktop extension

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish verified desktop release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^desktop-v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Invalid desktop release tag');
          const version = tag.slice('desktop-v'.length);
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const config = readFileSync('project/config.ts', 'utf8');
          const publicVersion = config.match(/export const ProjectVersion = "([^"]+)";/)?.[1];
          if ([pkg.version, lock.version, lock.packages[''].version, publicVersion].some(value => value !== version)) {
            throw new Error('Release tag, package, lockfile and public extension versions must match');
          }
          if (!existsSync(`docs/releases/desktop-${version}.md`)) throw new Error('Release notes are missing');
          console.log(`Validated desktop ${version}`);
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx --no-install tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Package versioned extension and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#desktop-v}"
          cp dist/icy-lyrics.js "dist/icy-lyrics-${version}.js"
          cd dist
          sha256sum "icy-lyrics-${version}.js" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#desktop-v}"
          gh release create "$RELEASE_TAG" \
            "dist/icy-lyrics-${version}.js" dist/SHA256SUMS.txt \
            --verify-tag --latest \
            --title "Icy Lyrics Desktop ${version}" \
            --notes-file "docs/releases/desktop-${version}.md"
