name: Public source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      additional_ios_parity:
        description: 'Run opt-in extended UIKit surfaces and motion capture evidence'
        type: boolean
        required: false
        default: false
      font_backend_probe:
        description: 'Run standalone pinned FreeType/CoreText font rendering experiment'
        type: boolean
        required: false
        default: false
      font_backend_only:
        description: 'Run only the standalone font experiment; skip desktop, Android, and iPhone builds'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  extension:
    name: Desktop extension
    if: github.event_name != 'workflow_dispatch' || inputs.font_backend_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  android-play:
    name: Android Play distribution
    if: github.event_name != 'workflow_dispatch' || inputs.font_backend_only != true
    runs-on: ubuntu-latest
    env:
      ICY_LYRICS_PRIVATE_FEATURE_PATH: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Verify and build only the public Play flavor
        working-directory: android-v2
        run: >-
          ./gradlew --no-daemon
          testPlayDebugUnitTest
          lintPlayDebug
          verifyPlayDistributionBoundary
          bundlePlayRelease

  ios-sideload:
    name: iPhone simulator and resignable IPA
    # Standard public-repository runners only: never opt into billed private/larger runners.
    if: github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.font_backend_only != true)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      SPOTIFY_CLIENT_ID: ${{ vars.ICY_IOS_SPOTIFY_CLIENT_ID }}
      ICY_LYRICS_PRIVATE_FEATURE_PATH: ''
      ICY_ADDITIONAL_IOS_PARITY: ${{ github.event_name == 'workflow_dispatch' && inputs.additional_ios_parity }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Restore iOS compiler and dependency caches
        id: ios_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: icy-ios-${{ runner.os }}-${{ runner.arch }}-xcode26.4.1-v1-${{ hashFiles('iOS/**/*.gradle.kts', 'iOS/**/gradle.lockfile', 'iOS/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            icy-ios-${{ runner.os }}-${{ runner.arch }}-xcode26.4.1-v1-
      - name: Verify simulator and package the unsigned device application
        id: ios_build
        run: bash iOS/scripts/build_ios.sh
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: icy-ios-verification
          path: |
            iOS/build/reports/
            iOS/build/SimulatorTests.xcresult/
            iOS/shared/*/build/reports/tests/
            !iOS/build/reports/extended-ios/**
            !iOS/build/reports/additional-parity/**
            !iOS/build/reports/deterministic-ios-captures/mixed-lyrics-motion-v1/**
            !iOS/build/reports/motion-ios-tests/**
          if-no-files-found: warn
      - name: Capture opt-in additional iPhone parity evidence
        if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.additional_ios_parity
        run: bash iOS/scripts/capture_additional_ios.sh
      - name: Clean up the retained additional-capture simulator
        if: always() && github.event_name == 'workflow_dispatch' && inputs.additional_ios_parity
        shell: bash
        run: |
          if [[ -f iOS/build/reports/retained-ios-simulator.txt ]]; then
            simulator="$(cat iOS/build/reports/retained-ios-simulator.txt)"
            if [[ "$simulator" =~ ^[a-fA-F0-9-]{36}$ ]]; then
              xcrun simctl shutdown "$simulator" >/dev/null 2>&1 || true
              xcrun simctl delete "$simulator" >/dev/null 2>&1 || true
            fi
          fi
      - name: Upload opt-in additional parity evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.additional_ios_parity
        uses: actions/upload-artifact@v7
        with:
          name: icy-ios-additional-parity
          path: |
            iOS/build/reports/additional-parity/
            iOS/build/reports/extended-ios/
            iOS/build/reports/deterministic-ios-captures/mixed-lyrics-motion-v1/
            iOS/build/reports/motion-ios-tests/
          if-no-files-found: warn
      - name: Upload encrypted delivery for the owner
        if: '!cancelled() && steps.ios_build.outcome == ''success'''
        uses: actions/upload-artifact@v7
        with:
          name: icy-lyrics-owner-encrypted
          # This directory contains ciphertext and public transfer metadata only.
          # Never upload its parent: the local owner identity is stored there.
          path: iOS/build/owner-delivery/encrypted/
          if-no-files-found: error
      - name: Upload resignable IPA after distribution review
        # User's requested SDK/source-license gate; this is not an App Store signing gate.
        if: '!cancelled() && steps.ios_build.outcome == ''success'' && vars.ICY_IOS_BINARY_DISTRIBUTION_CLEARED == ''true'''
        uses: actions/upload-artifact@v7
        with:
          name: icy-lyrics-unsigned-iphone
          path: iOS/build/delivery/
          if-no-files-found: error
      - name: Save iOS compiler and dependency caches
        # Keep downloaded toolchains after a test failure, so the next fix can
        # reach native compilation without repeating the initial downloads.
        if: always() && !cancelled() && steps.ios_cache.outputs.cache-primary-key != '' && steps.ios_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ steps.ios_cache.outputs.cache-primary-key }}

  ios-font-backend-probe:
    name: Optional standalone font backend experiment
    # Independent diagnostic job on a standard public-repository runner only.
    # This never supplies an app verification marker or a delivery artifact.
    if: github.event.repository.private == false && github.event_name == 'workflow_dispatch' && (inputs.font_backend_probe || inputs.font_backend_only)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      ICY_LYRICS_PRIVATE_FEATURE_PATH: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test font probe integrity and result gates
        run: python3 -m unittest discover -s iOS/experiments/freetype -p 'test_*.py' -v
      - name: Build and execute the isolated font probe
        run: bash iOS/experiments/freetype/run_macos.sh --jobs 4 --work-dir "$GITHUB_WORKSPACE/iOS/build/freetype-probe/ci"
      - name: Upload font probe evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: icy-font-backend-probe
          path: |
            iOS/build/freetype-probe/ci/run.json
            iOS/build/freetype-probe/ci/sources.lock.json
            iOS/build/freetype-probe/ci/verified-inputs.json
            iOS/build/freetype-probe/ci/validation.json
            iOS/build/freetype-probe/ci/android-context-comparison.json
            iOS/build/freetype-probe/ci/android36-font-metrics.json
            iOS/build/freetype-probe/ci/captures/*.json
            iOS/build/freetype-probe/ci/captures/*.png
            iOS/build/freetype-probe/ci/*.log
          if-no-files-found: warn
